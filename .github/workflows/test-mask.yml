name: Test Masking Rev
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tes masking secret (dummy)
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
            echo "SECRET_KOSONG=true"
          else
            REV=$(printf '%s' "$TEST_SECRET" | rev)
            echo "REV_RESULT=$REV"
          fi
